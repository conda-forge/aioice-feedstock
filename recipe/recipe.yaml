schema_version: 1

context:
  version: "0.14.1"

package:
  name: aioice
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/aioice/aioice-${{ version }}.tar.gz
  sha256: 80ab4d9876167e1cc15f8e20b43cbc7ed27273419f6b6f2727d9fae770e7b771

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python =${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - dnspython >=2.0.0
    - ifaddr >=0.2.0

tests:
  - python:
      imports:
        - aioice
  - requirements:
      run:
        - pip
        - python =${{ python_min }}
    script:
      - pip check

about:
  summary: An implementation of Interactive Connectivity Establishment (RFC 5245)
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/aiortc/aioice

extra:
  recipe-maintainers:
    - danielnachun
