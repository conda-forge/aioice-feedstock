schema_version: 1

context:
  version: "0.11.0"

package:
  name: aioice
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/aioice/aioice-${{ version }}.tar.gz
  sha256: 71cc1b1104b88d7ca3c63a64d7d7fb9e4a8d9411c3da64814b43645d6a7990e1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python =${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - dnspython >=2.0.0
    - ifaddr >=0.2.0

tests:
  - python:
      imports:
        - aioice
  - requirements:
      run:
        - pip
        - python =${{ python_min }}
    script:
      - pip check

about:
  summary: An implementation of Interactive Connectivity Establishment (RFC 5245)
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/aiortc/aioice

extra:
  recipe-maintainers:
    - danielnachun
